<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VT Designer</title>
  <meta name="description" content="VT Designer – ISOBUS object pools (ISO 11783-6) ontwerpen en exporteren voor TIA Portal en CODESYS">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top"></header>
    <main>
      <aside id="left">
        <div id="left-tabs" class="tabs"></div>
        <div id="tree" class="panel"></div>
      </aside>
      <section id="center">
        <div id="toolbar"></div>
        <div id="canvas"></div>
        <div id="status"></div>
      </section>
      <aside id="right"><div id="props" class="panel"></div></aside>
    </main>
  </div>
  <noscript>VT Designer heeft JavaScript nodig.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
